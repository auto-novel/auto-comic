services:
  web:
    image: ghcr.io/auto-novel/auto-comic-web:latest
    restart: unless-stopped
    ports:
      - 7000:80
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1 || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/auto-novel/auto-comic-api:latest
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - HTTP_ADDR=:7001
      - DB_HOST=postgresql
      - DB_PORT=5432
      - DB_USER=auto-comic
      - DB_NAME=auto-comic
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:7001/ready || exit 1']
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 5

  postgresql:
    image: postgres:17.7-alpine3.23
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER=auto-comic
      - POSTGRES_DB=auto-comic
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -h 127.0.0.1 -d $${POSTGRES_DB} -U $${POSTGRES_USER}' ]
      start_period: 60s
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  default:
    name: auto-comic
    driver: bridge
